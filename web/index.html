<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GAYA.ID — Asisten Belanja</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body data-view="panduan">
    <!-- Wajah asisten dipakai berulang; disimpan sekali sebagai template. -->
    <template id="tpl-wajah">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="12" cy="13" r="2" fill="#fff" />
        <circle cx="20" cy="13" r="2" fill="#fff" />
        <path
          d="M11 19.4c1.4 1.7 3.1 2.5 5 2.5s3.6-.8 5-2.5"
          stroke="#fff"
          stroke-width="2.1"
          stroke-linecap="round"
        />
      </svg>
    </template>

    <!-- ============ LAYAR PANDUAN ============ -->
    <section id="view-panduan" class="view">
      <header class="topbar">
        <div class="brand">
          <span class="brand__mark">GAYA.ID</span>
          <span class="brand__tagline" data-i18n="tagline"></span>
        </div>
        <div class="topbar__tools">
          <div class="langswitch" role="group" aria-label="Bahasa">
            <button type="button" data-lang="id" aria-pressed="true">ID</button>
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
          </div>
          <div id="status-panduan" class="status-pill" data-state="memanaskan">
            <span class="dot"></span>
            <span data-i18n="status.memanaskan"></span>
          </div>
        </div>
      </header>

      <main class="shell">
        <div class="hero">
          <div class="avatar" data-wajah>
            <span class="hero__badge"></span>
          </div>
          <div class="hero__text">
            <h1 data-i18n="hero.judul"></h1>
            <p data-i18n="hero.teks"></p>
          </div>
        </div>

        <section class="section">
          <div class="section__head">
            <h2 data-i18n="bisa.judul"></h2>
            <span class="hint">
              <span class="dot"></span>
              <span data-i18n="bisa.hint"></span>
            </span>
          </div>
          <div class="grid-4" id="kartu-kemampuan"></div>
        </section>

        <section class="section">
          <div>
            <h2 data-i18n="sumber.judul"></h2>
            <p class="section__note" data-i18n="sumber.teks"></p>
          </div>
          <div class="grid-2">
            <div class="card">
              <div class="card__top">
                <span class="icon-tile">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1e2f6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
                    <path d="M14 3v5h5" />
                  </svg>
                </span>
              </div>
              <div>
                <h3 data-i18n="sumber.dok.judul"></h3>
                <p data-i18n="sumber.dok.teks"></p>
              </div>
              <div class="source-card__rows" id="daftar-dokumen"></div>
            </div>
            <div class="card">
              <div class="card__top">
                <span class="icon-tile icon-tile--db">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#177c86" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <ellipse cx="12" cy="6" rx="8" ry="3" />
                    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6" />
                    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" />
                  </svg>
                </span>
              </div>
              <div>
                <h3 data-i18n="sumber.db.judul"></h3>
                <p data-i18n="sumber.db.teks"></p>
              </div>
              <div class="source-card__rows" id="daftar-database"></div>
            </div>
          </div>
        </section>

        <section class="section" id="blok-contoh" hidden>
          <div>
            <h2 data-i18n="contoh.judul"></h2>
            <p class="section__note" data-i18n="contoh.teks"></p>
          </div>
          <div class="facts" id="daftar-contoh"></div>
          <p class="section__note" data-i18n="contoh.catatan"></p>
        </section>

        <div class="grid-2">
          <div class="card">
            <h3 data-i18n="batas.judul"></h3>
            <div class="limits" id="daftar-batas"></div>
          </div>
          <div class="card">
            <h3 data-i18n="kecuali.judul"></h3>
            <p data-i18n="kecuali.teks"></p>
            <div class="files">
              <code>05_product_catalog.pdf</code>
              <code>06_business_report.pdf</code>
            </div>
          </div>
        </div>

        <div class="cta">
          <div>
            <h2 data-i18n="mulai.judul"></h2>
            <div class="cta__rules">
              <span class="cta__rule">
                <i id="aturan-kuota">8</i>
                <span data-i18n="mulai.kuota"></span>
              </span>
              <span class="cta__rule cta__rule--cost">
                <i>$</i>
                <span data-i18n="mulai.biaya"></span>
              </span>
              <span class="cta__rule cta__rule--free">
                <i>&#8226;</i>
                <span data-i18n="mulai.gratis"></span>
              </span>
            </div>
          </div>
          <div class="cta__action">
            <button type="button" class="btn-primary" id="mulai-demo">
              <span data-i18n="mulai.tombol"></span>
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h13" /><path d="m12 5 7 7-7 7" />
              </svg>
            </button>
            <span class="cta__hint" data-i18n="mulai.catatan"></span>
          </div>
        </div>

        <footer class="footer">
          <span data-i18n="footer.kiri"></span>
          <span data-i18n="footer.kanan"></span>
        </footer>
      </main>
    </section>

    <!-- ============ LAYAR CHAT ============ -->
    <section id="view-chat" class="view">
      <aside class="sidebar">
        <div class="sidebar__who">
          <div class="avatar" data-wajah></div>
          <div>
            <b>Gaya</b>
            <span data-i18n="chat.peran"></span>
          </div>
        </div>

        <div class="meters">
          <div>
            <div class="meter__head">
              <span data-i18n="meter.kuota"></span>
              <span class="meter__value" id="teks-kuota">—</span>
            </div>
            <div class="pips" id="pips-kuota"></div>
          </div>
          <div>
            <div class="meter__head">
              <span data-i18n="meter.anggaran"></span>
              <span class="meter__value meter__value--cost" id="teks-anggaran">—</span>
            </div>
            <div class="bar"><div class="bar__fill" id="bar-anggaran" style="width: 0%"></div></div>
            <span class="meter__note" id="catatan-anggaran"></span>
          </div>
        </div>

        <div class="sidebar__group sidebar__group--sumber">
          <b data-i18n="chat.sumber"></b>
          <div class="srcpill srcpill--doc">
            <i></i>
            <div>
              <b data-i18n="chat.sumber.dok"></b>
              <span id="jumlah-chunk"></span>
            </div>
          </div>
          <div class="srcpill srcpill--db">
            <i></i>
            <div>
              <b data-i18n="chat.sumber.db"></b>
              <span data-i18n="chat.sumber.db.ket"></span>
            </div>
          </div>
        </div>

        <button type="button" class="btn-ghost" id="obrolan-baru">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 1 2.6 6.4" /><path d="M3 19v-5h5" />
          </svg>
          <span data-i18n="chat.obrolanBaru"></span>
        </button>

        <p class="sidebar__foot" data-i18n="chat.catatanBiaya"></p>
      </aside>

      <div class="chatmain">
        <header class="chatbar">
          <span class="chatbar__who">
            <span class="dot"></span>
            <span data-i18n="chat.siap"></span>
          </span>
          <button type="button" class="btn-ghost" id="kembali-panduan" style="padding: 9px 16px">
            <span data-i18n="chat.lihatPanduan"></span>
          </button>
        </header>

        <div class="stubbanner" id="pita-contoh" hidden>
          <b data-i18n="stub.label"></b>
          <span data-i18n="stub.teks"></span>
        </div>

        <div class="thread" id="thread" aria-live="polite"></div>

        <form class="composer" id="composer">
          <div class="composer__row">
            <input
              id="pesan"
              type="text"
              maxlength="500"
              autocomplete="off"
              data-i18n-placeholder="chat.placeholder"
            />
            <button type="submit" class="send" id="kirim" aria-label="Kirim">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h13" /><path d="m12 5 7 7-7 7" />
              </svg>
            </button>
          </div>
          <div class="composer__foot">
            <span id="sisa-pertanyaan"></span>
            <span data-i18n="chat.disclaimer"></span>
          </div>
        </form>
      </div>
    </section>

    <script type="module" src="/static/js/main.js"></script>
  </body>
</html>
