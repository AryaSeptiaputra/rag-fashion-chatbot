[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-fashion-chatbot"
version = "0.1.0"
description = "Customer service AI untuk clothing brand: FAQ, stok, produk, dan pesanan"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.api.chat",
    "app.api.demo",
    "app.models",
    "app.prompts",
    "app.repositories",
    "app.services",
    "app.tools",
    "app.utils",
]
